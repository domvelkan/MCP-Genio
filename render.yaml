services:
  - type: web
    name: mcp-genio
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: GENIO_MCP_TOKEN
        sync: false
      - key: VISUAL_API_TOKEN
        sync: false
      - key: KERNEL_GATEWAY_URL
        value: https://andaris-kernel.onrender.com
      - key: KERNEL_GATEWAY_TOKEN
        sync: false
      - key: COCKPIT_BRIDGE_TOKEN
        sync: false
      - key: ANDARIA_VISUAL_RENDER_URL
        value: https://andaria.onrender.com/api/cockpit/visual/render
      - key: AI_PROVIDER
        value: openrouter
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_MODEL
        sync: false
      - key: NVIDIA_API_KEY
        sync: false
      - key: NVIDIA_BASE_URL
        value: https://integrate.api.nvidia.com/v1
      - key: NVIDIA_MODEL
        sync: false
      - key: ANDARIA_SITE
        value: https://andaria.com.br
      - key: COMFYUI_URL
        sync: false
      - key: N8N_URL
        sync: false
      - key: N8N_API_KEY
        sync: false
      - key: N8N_ALLOWED_WORKFLOWS
        sync: false
      - key: N8N_WEBHOOK_BASE
        sync: false
      - key: N8N_WORKFLOW_WEBHOOK_MAP
        value: '{}'
      - key: HERMES_HEALTH_URL
        sync: false
      - key: LOG_LEVEL
        value: INFO
